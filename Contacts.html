<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Me contacter - Mon CV</title>
    <link href="bootstrap-5.2.3-dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-warning" href="Accueil.html">MonPortfolio</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="Accueil.html">Accueil</a></li>
                    <li class="nav-item"><a class="nav-link" href="Apropos.html">À propos</a></li>
                    <li class="nav-item"><a class="nav-link" href="Projets.html">Projets</a></li>
                    <li class="nav-item"><a class="nav-link active" href="Contacts.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container mt-5 pt-5">
        <div class="row">
            <div class="col-md-6 offset-md-3">
                <div class="text-center mb-5">
                    <h1 class="display-5 fw-bold text-primary">Me contacter</h1>
                    <p class="lead text-secondary">N'hésitez pas à laisser un message</p>
                    <div class="border-bottom border-warning w-25 mx-auto mt-3"></div>
                </div>
                <div class="card border-warning shadow">
                    <div class="card-header bg-primary text-white text-center">
                        <i class="bi bi-envelope-paper"></i> Formulaire de contact
                    </div>
                    <div class="card-body">
                        <form action="#" method="post">
                            <div class="mb-3">
                                <label for="nom" class="form-label fw-bold text-primary">
                                    <i class="bi bi-person"></i> Nom
                                </label>
                                <input type="text" class="form-control border-warning" id="nom" name="nom" required>
                            </div>

                            <div class="mb-3">
                                <label for="prenom" class="form-label fw-bold text-primary">
                                    <i class="bi bi-person-badge"></i> Prénom
                                </label>
                                <input type="text" class="form-control border-warning" id="prenom" name="prenom" required>
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label fw-bold text-primary">
                                    <i class="bi bi-envelope"></i> Adresse mail
                                </label>
                                <input type="email" class="form-control border-warning" id="email" name="email" required>
                            </div>

                            <div class="mb-3">
                                <label for="avis" class="form-label fw-bold text-primary">
                                    <i class="bi bi-chat-dots"></i> Votre avis / Message
                                </label>
                                <textarea class="form-control border-warning" id="avis" name="avis" rows="5" required></textarea>
                            </div>

                            <div class="text-center">
                                <button type="submit" class="btn btn-secondary btn-lg px-5">
                                    <a class="text-primary" href="danekeessotina@gmail.com">
                                        <i class="bi bi-send"></i> ENVOYER
                                    </a>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer class="bg-primary text-white text-center py-3 mt-5">
        <p class="mb-0">&copy; 2026 - Tous droits réservés</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
